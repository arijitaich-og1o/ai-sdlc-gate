openapi: 3.0.3
info:
  title: Order Service
  version: "1.0"
paths:
  /v1/orders:
    get:
      summary: List all orders
      responses:
        "200":
          description: All orders in the system
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: Create order
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "200":
          description: Created
  /v1/orders/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          description: Error
          content:
            text/plain:
              schema:
                type: string
    delete:
      summary: Cancel and refund order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refunded
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        customer:
          type: string
        total:
          type: string
          example: "₹1,299.00"
        status:
          type: string
        items:
          type: array
          items:
            type: object
        notes:
          type: string
