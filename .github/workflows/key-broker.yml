# Key broker: gives an installed client the model-backend configuration held in this repository's secrets, without
# any of it appearing in plaintext outside the runner and the requesting machine.
#
# The client generates an RSA key pair, triggers this workflow with the PUBLIC key using the developer's GitHub
# credential, and downloads the artifact. The artifact is a hybrid envelope: a random AES-256-GCM key encrypts the
# configuration, and that key is wrapped with RSA-OAEP/SHA-256 to the requester's public key. The client decrypts
# it and stores it in the operating system credential store.
#
# Backend selection (scripts/broker_payload.py): if the VERTEX_SA_KEY secret is present, the client is configured
# for Anthropic on Vertex AI (secrets VERTEX_SA_KEY, VERTEX_PROJECT, optional VERTEX_LOCATION, VERTEX_MODELS).
# Otherwise the OpenAI-compatible gateway is used (LITELLM_API_KEY, LITELLM_BASE_URL, optional LITELLM_MODELS).
name: Key Broker

run-name: "key-broker ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque request id generated by the client (32 hex characters)"
        type: string
        required: true
      public_key:
        description: "PEM-encoded RSA public key of the requesting client"
        type: string
        required: true

permissions: {}

jobs:
  broker:
    name: Issue configuration for the requester
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the broker scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the request
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUEST_ID" | grep -Eq '^[0-9a-f]{32}$' || { echo "::error::invalid request id"; exit 1; }
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/pub.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/pub.pem" -noout || { echo "::error::invalid public key"; exit 1; }
          BITS="$(openssl pkey -pubin -in "$RUNNER_TEMP/pub.pem" -text -noout | grep -Eo 'Public-Key: \([0-9]+ bit\)' | grep -Eo '[0-9]+')"
          [ "${BITS:-0}" -ge 2048 ] || { echo "::error::public key too small"; exit 1; }

      - name: Assemble the configuration
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_MODELS: ${{ secrets.LITELLM_MODELS }}
          VERTEX_SA_KEY: ${{ secrets.VERTEX_SA_KEY }}
          VERTEX_PROJECT: ${{ secrets.VERTEX_PROJECT }}
          VERTEX_LOCATION: ${{ secrets.VERTEX_LOCATION }}
          VERTEX_MODELS: ${{ secrets.VERTEX_MODELS }}
          DEVELOPER: ${{ github.actor }}
        run: |
          set -euo pipefail
          python3 scripts/broker_payload.py > "$RUNNER_TEMP/plain.json"

      - name: Encrypt the configuration for the requester
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'cryptography>=42.0'
          mkdir -p "$RUNNER_TEMP/out"
          python3 scripts/broker_seal.py "$RUNNER_TEMP/pub.pem" "$RUNNER_TEMP/plain.json" "$RUNNER_TEMP/out/config.enc"
          rm -f "$RUNNER_TEMP/plain.json"
          echo "encrypted configuration issued"

      - name: Publish the encrypted configuration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: key-${{ inputs.request_id }}
          path: ${{ runner.temp }}/out/config.enc
          retention-days: 1
          if-no-files-found: error
