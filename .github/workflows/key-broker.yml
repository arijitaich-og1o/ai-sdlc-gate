# Key broker: gives an installed client the model-gateway configuration (endpoint, key, model names) held in this
# repository's secrets, without any of it appearing in plaintext outside the runner and the requesting machine.
#
# The client generates an RSA key pair, triggers this workflow with the PUBLIC key using the developer's GitHub
# credential, and downloads the artifact. The artifact is the configuration encrypted to that public key
# (RSA-OAEP/SHA-256); the client decrypts it and stores it in the operating system credential store.
name: Key Broker

run-name: "key-broker ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque request id generated by the client (32 hex characters)"
        type: string
        required: true
      public_key:
        description: "PEM-encoded RSA public key of the requesting client"
        type: string
        required: true

permissions: {}

jobs:
  broker:
    name: Issue configuration for the requester
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate the request
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUEST_ID" | grep -Eq '^[0-9a-f]{32}$' || { echo "::error::invalid request id"; exit 1; }
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/pub.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/pub.pem" -noout || { echo "::error::invalid public key"; exit 1; }
          BITS="$(openssl pkey -pubin -in "$RUNNER_TEMP/pub.pem" -text -noout | grep -Eo 'Public-Key: \([0-9]+ bit\)' | grep -Eo '[0-9]+')"
          [ "${BITS:-0}" -ge 2048 ] || { echo "::error::public key too small"; exit 1; }

      - name: Encrypt the configuration for the requester
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_MODELS: ${{ secrets.LITELLM_MODELS }}
          DEVELOPER: ${{ github.actor }}
        run: |
          set -euo pipefail
          [ -n "${LITELLM_API_KEY:-}" ] || { echo "::error::the LITELLM_API_KEY secret is not configured"; exit 1; }
          [ -n "${LITELLM_BASE_URL:-}" ] || { echo "::error::the LITELLM_BASE_URL secret is not configured"; exit 1; }
          # Accept a key pasted together with its display name and keep only the token.
          KEY="$(printf '%s' "$LITELLM_API_KEY" | grep -Eo 'sk-[A-Za-z0-9_-]{16,}' | head -n1 || true)"
          [ -n "$KEY" ] || { echo "::error::LITELLM_API_KEY does not contain a gateway key (expected a token starting with 'sk-')"; exit 1; }
          [ "$KEY" = "$LITELLM_API_KEY" ] || echo "::warning::LITELLM_API_KEY contained extra text around the key; only the key token was used."
          if [ -z "${LITELLM_MODELS:-}" ]; then
            echo "::warning::the LITELLM_MODELS secret is not set; clients will use the engine's built-in model list. Set it (comma separated: review,judge,fallback,...) to keep model names out of the repository."
          fi
          mkdir -p "$RUNNER_TEMP/out"
          KEY="$KEY" python3 -c 'import json, os
          models = [m.strip() for m in os.environ.get("LITELLM_MODELS", "").split(",") if m.strip()]
          print(json.dumps({"base_url": os.environ["LITELLM_BASE_URL"].rstrip("/"), "api_key": os.environ["KEY"], "models": models,
                            "mode": "shared", "developer": os.environ["DEVELOPER"]}))' > "$RUNNER_TEMP/plain.json"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -in "$RUNNER_TEMP/plain.json" -out "$RUNNER_TEMP/out/config.enc"
          rm -f "$RUNNER_TEMP/plain.json"
          echo "encrypted configuration issued to $DEVELOPER"

      - name: Publish the encrypted configuration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: key-${{ inputs.request_id }}
          path: ${{ runner.temp }}/out/config.enc
          retention-days: 1
          if-no-files-found: error
