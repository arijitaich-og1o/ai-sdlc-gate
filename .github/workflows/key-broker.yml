# Key broker: hands the LiteLLM configuration held in this repository's secrets to an installed client (workflow_dispatch only).
#
# The client (a developer with access to this repository) generates an RSA key pair, triggers this workflow with
# its PUBLIC key, and downloads the artifact. The artifact contains the LiteLLM endpoint and key encrypted with
# that public key (RSA-OAEP/SHA-256), so only the requesting machine can read it. The plaintext key never leaves
# the runner. Rotation: update the secret and have clients run `sdlc-gate configure` again.
name: Key Broker

run-name: "key-broker ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque request id generated by the client (32 hex characters)"
        type: string
        required: true
      public_key:
        description: "PEM-encoded RSA public key of the requesting client"
        type: string
        required: true

permissions: {}

jobs:
  broker:
    name: Encrypt configuration for the requester
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate the request
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUEST_ID" | grep -Eq '^[0-9a-f]{32}$' || { echo "::error::invalid request id"; exit 1; }
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/pub.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/pub.pem" -noout || { echo "::error::invalid public key"; exit 1; }
          BITS="$(openssl pkey -pubin -in "$RUNNER_TEMP/pub.pem" -text -noout | grep -Eo 'Public-Key: \([0-9]+ bit\)' | grep -Eo '[0-9]+')"
          [ "${BITS:-0}" -ge 2048 ] || { echo "::error::public key too small"; exit 1; }

      - name: Encrypt the LiteLLM configuration
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${LITELLM_API_KEY:-}" ]; then echo "::error::LITELLM_API_KEY secret is not configured"; exit 1; fi
          # Accept a key pasted together with its LiteLLM display name ("Name: sk-...") and keep only the key.
          KEY="$(printf '%s' "$LITELLM_API_KEY" | grep -Eo 'sk-[A-Za-z0-9_-]{16,}' | head -n1 || true)"
          if [ -z "$KEY" ]; then echo "::error::LITELLM_API_KEY does not contain a LiteLLM virtual key (expected a token starting with 'sk-')"; exit 1; fi
          if [ "$KEY" != "$LITELLM_API_KEY" ]; then echo "::warning::LITELLM_API_KEY contained extra text around the key (a label or whitespace); only the 'sk-' token was used. Consider saving the bare key."; fi
          LITELLM_API_KEY="$KEY"
          mkdir -p "$RUNNER_TEMP/out"
          printf '{"base_url":"%s","api_key":"%s"}' "${LITELLM_BASE_URL:-https://litellm-dev.dev.aime.osp-fine.de}" "$LITELLM_API_KEY" > "$RUNNER_TEMP/plain.json"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -in "$RUNNER_TEMP/plain.json" -out "$RUNNER_TEMP/out/config.enc"
          rm -f "$RUNNER_TEMP/plain.json"
          echo "encrypted $(wc -c < "$RUNNER_TEMP/out/config.enc") bytes for the requester"

      - name: Publish the encrypted configuration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: key-${{ inputs.request_id }}
          path: ${{ runner.temp }}/out/config.enc
          retention-days: 1
          if-no-files-found: error
