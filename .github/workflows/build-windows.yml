name: build-windows-installer

# Produces the self-contained Windows installer (ai-sdlc-gate-setup-<version>.exe).
# Runs on demand and on version tags; attaches the installer to the GitHub Release for a tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the installer"
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write   # to upload the installer to the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          if (-not $v) { $v = "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: pwsh packaging/windows/build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-sdlc-gate-windows-installer
          path: dist/ai-sdlc-gate-setup-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ai-sdlc-gate-setup-*.exe
