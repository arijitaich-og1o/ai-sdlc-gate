name: build-windows-installer

# Produces the self-contained Windows installer (ai-sdlc-gate-setup-<version>.exe).
# Runs on demand and on version tags; attaches the installer to the GitHub Release for a tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the installer"
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write   # to upload the installer to the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          if (-not $v) { $v = "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: pwsh packaging/windows/build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-sdlc-gate-windows-installer
          path: dist/ai-sdlc-gate-setup-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/ai-sdlc-gate-setup-*.exe
