# This repository is gated by its own gate. On pull requests the engine and skills from the PR head are used,
# so a change to the engine is exercised before it can be merged.
name: Self Gate

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: self-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ai-sdlc-gate.yml
    with:
      gate-ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
