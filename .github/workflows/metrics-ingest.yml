# Receives gate results from every repository (repository_dispatch) and appends them to the `metrics` branch,
# then rebuilds the management dashboard. Payloads are validated by the engine before they are stored.
name: Metrics Ingest

on:
  repository_dispatch:
    types: [sdlc-gate-result]

permissions: {}

concurrency:
  group: metrics-branch
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      STORE: ${{ github.workspace }}/.metrics-store
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the gate engine
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet ./gate

      - name: Write the payload to disk
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/payload.json"

      - name: Check out (or create) the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" metrics > /dev/null; then
            git clone --quiet --depth 50 --branch metrics "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$STORE"
          else
            mkdir -p "$STORE" && cd "$STORE"
            git init --quiet --initial-branch=metrics
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            printf '# SDLC Gate metrics\n\nMachine-written branch. Do not edit by hand.\n' > README.md
          fi

      - name: Ingest the event and rebuild the dashboard
        run: |
          set -euo pipefail
          sdlc-gate metrics ingest --payload "$RUNNER_TEMP/payload.json" --events-dir "$STORE/events"
          sdlc-gate metrics build --events-dir "$STORE/events" --out "$STORE/dashboard"

      - name: Commit and push (with retry)
        run: |
          set -euo pipefail
          cd "$STORE"
          git config user.name "sdlc-gate-bot"
          git config user.email "sdlc-gate-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Duplicate event; nothing to commit."; exit 0; fi
          git commit --quiet -m "metrics: ingest gate result"
          for attempt in 1 2 3 4 5; do
            if git push --quiet origin HEAD:refs/heads/metrics; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing"
            git fetch --quiet origin metrics && git rebase --quiet origin/metrics || { git rebase --abort || true; }
            sdlc-gate metrics build --events-dir events --out dashboard
            git add -A && git commit --quiet --amend --no-edit
            sleep $((attempt * 3))
          done
          echo "::error::Could not push metrics after 5 attempts"; exit 1
