# .github/dependabot.yml
# Generated by /secure-code-review --emit-ci
#
# Dependabot opens PRs to update outdated dependencies — including
# GitHub Actions SHA updates, keeping your CI supply chain secure.
#
# Setup: copy to .github/dependabot.yml in your repository.
# Free for all repos (public and private).
#
# Customize: remove ecosystems not present in your repo,
# or add go-modules, cargo, maven, gradle, nuget as needed.

version: 2

updates:
  # GitHub Actions — keeps SHA-pinned actions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "security"

  # npm / Node.js
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]   # major bumps need manual review

  # Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "security"

  # Terraform providers and modules
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
