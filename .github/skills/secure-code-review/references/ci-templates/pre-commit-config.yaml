# .pre-commit-config.yaml
# Generated by /secure-code-review --emit-ci
#
# Runs security checks automatically before every git commit.
# The /secure-code-review skill itself does NOT call these tools —
# this file is for teams that want automated commit-time scanning.
#
# Setup (one-time, per developer):
#   pip install pre-commit
#   pre-commit install          # installs git hook
#   pre-commit install --hook-type commit-msg   # optional: commit message checks
#
# Run manually on all files:
#   pre-commit run --all-files
#
# Update all hooks to latest pinned versions:
#   pre-commit autoupdate       # then review and commit the updated revs
#
# Tools included:
#   - Gitleaks: secrets and API key detection in staged files
#   - pre-commit-hooks: private key detection, merge conflict markers
#   - Hadolint: Dockerfile best-practice and security linting
#   - detect-secrets: additional entropy-based secret detection
#
# All hooks are pinned to exact version tags for reproducibility.

default_language_version:
  python: python3

repos:
  # ── Secrets Detection ────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        name: Detect secrets (Gitleaks)
        description: Scans staged files for API keys, tokens, and passwords
        # To allow a false positive, use: git commit -m "msg" --no-verify
        # OR add an inline comment: # gitleaks:allow

  # ── General Security Checks ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-private-key
        name: Detect private keys
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: check-added-large-files
        name: Prevent large file commits
        args: ['--maxkb=1000']
      - id: check-json
        name: Validate JSON files
      - id: check-yaml
        name: Validate YAML files
        args: ['--unsafe']   # allows custom YAML tags (e.g. Kubernetes)
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ── Entropy-Based Secret Detection ───────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect high-entropy secrets
        args:
          - '--baseline'
          - '.secrets.baseline'   # run: detect-secrets scan > .secrets.baseline (once)
          - '--exclude-files'
          - 'package-lock.json|yarn.lock|poetry.lock|Gemfile.lock|go.sum|Cargo.lock'
        exclude: >
          (?x)^(
            .*\.min\.js|
            .*\.bundle\.js|
            dist/.*|
            build/.*
          )$

  # ── Dockerfile Linting ────────────────────────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Dockerfile security lint (Hadolint)
        # Ignore rules: https://github.com/hadolint/hadolint#rules
        # Add project-specific ignores here:
        args:
          - '--ignore'
          - 'DL3008'   # pin apt-get versions — noisy, enable if you want strict pinning
          - '--ignore'
          - 'DL3009'   # delete apt-get lists — enable for minimal images

  # ── Python Security (if Python project) ──────────────────────────────────────
  # Uncomment if your project includes Python:
  # - repo: https://github.com/PyCQA/bandit
  #   rev: 1.7.6
  #   hooks:
  #     - id: bandit
  #       name: Python SAST (Bandit)
  #       args: ['-c', 'pyproject.toml']
  #       exclude: tests/

  # ── Node.js Security (if Node.js project) ────────────────────────────────────
  # Uncomment if your project includes Node.js:
  # - repo: local
  #   hooks:
  #     - id: npm-audit
  #       name: npm dependency audit
  #       language: system
  #       entry: npm audit --audit-level=high
  #       pass_filenames: false
  #       files: package(-lock)?\.json$
