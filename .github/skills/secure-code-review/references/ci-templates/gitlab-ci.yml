# .gitlab-ci.yml security jobs
# Generated by /secure-code-review --emit-ci
#
# Merge into your existing .gitlab-ci.yml or use as-is.
# All tool versions are pinned — update via: https://hub.docker.com/<tool>/tags
#
# Tools:
#   - Gitleaks: secrets detection
#   - Semgrep: SAST (OWASP Top 10, injection, auth, secrets)
#   - Trivy: dependency vulnerability + IaC scanning
#   - Checkov: Dockerfile, Terraform, Kubernetes policy checks
#
# Note: These tools are optional. /secure-code-review works without them.

stages:
  - security

variables:
  SEMGREP_TIMEOUT: "300"

# ── Secrets Detection ──────────────────────────────────────────────────────────
gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.18.0
    entrypoint: [""]
  script:
    - gitleaks detect --source . --exit-code 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── SAST ──────────────────────────────────────────────────────────────────────
semgrep:
  stage: security
  image: semgrep/semgrep:1.60.0
  script:
    - semgrep scan
        --config p/security-audit
        --config p/secrets
        --config p/owasp-top-ten
        --error
        --gitlab-sast
        --output gl-sast-report.json
      || true
  artifacts:
    reports:
      sast: gl-sast-report.json
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Dependency & IaC Scanning ─────────────────────────────────────────────────
trivy:
  stage: security
  image:
    name: aquasec/trivy:0.48.0
    entrypoint: [""]
  script:
    - trivy fs
        --exit-code 1
        --severity CRITICAL,HIGH
        --format template
        --template "@/contrib/gitlab.tpl"
        --output gl-dependency-scanning-report.json
        .
  artifacts:
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── IaC Policy ────────────────────────────────────────────────────────────────
checkov:
  stage: security
  image:
    name: bridgecrew/checkov:3.1.60
    entrypoint: [""]
  script:
    - checkov
        --directory .
        --framework dockerfile,terraform,kubernetes,secrets
        --output cli
        --soft-fail false
        # CKV_GIT_1 (SHA pinning) intentionally enabled
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
