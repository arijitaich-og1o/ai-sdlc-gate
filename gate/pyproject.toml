[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-gate"
version = "1.0.0"
description = "Otto Group One.O India - AI SDLC standardization gate (LiteLLM-backed)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "arijitaich-og1o" }]
dependencies = [
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
sdlc-gate = "sdlc_gate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdlc_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
