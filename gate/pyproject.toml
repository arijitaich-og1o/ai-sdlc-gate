[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-gate"
version = "1.0.0"
description = "Otto Group One.O India - AI SDLC standardization gate "
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "arijitaich-og1o" }]
dependencies = [
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "cryptography>=42.0",
  "keyring>=25.0",
  "PyJWT>=2.8,<3.0",   # RS256 signing for Vertex service-account tokens and Entra id_token verification
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ai-sdlc-gate = "ai_sdlc_gate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_sdlc_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
