# AI SDLC Gate policy for Otto Group One.O India.
# This file is the single source of truth for how the gate behaves. Changes require code-owner review.
version: 1

llm:
  # The model backend is never written into this repository. It is Anthropic on Google Vertex AI (repository secrets
  # VERTEX_SA_KEY / VERTEX_PROJECT / VERTEX_LOCATION / VERTEX_MODELS) or an OpenAI-compatible gateway (LITELLM_BASE_URL
  # / LITELLM_API_KEY / LITELLM_MODELS). Installed clients receive the whole configuration through the key broker and
  # keep it in the operating system credential store; the endpoint, project and model names stay out of the repo.
  base_url_env: LITELLM_BASE_URL
  api_key_env: LITELLM_API_KEY
  models_env: LITELLM_MODELS      # comma separated: review model, judge model, fallback models...
  timeout_seconds: 180
  max_retries: 3
  temperature: 0
  max_output_tokens: 8000

# The eight SDLC phases. This list is fixed; the repository must hold exactly one skill per phase.
phases:
  1: { slug: 01-planning,      name: Planning }
  2: { slug: 02-requirements,  name: Requirements Analysis }
  3: { slug: 03-design,        name: Design }
  4: { slug: 04-development,   name: Development }
  5: { slug: 05-testing,       name: Testing }
  6: { slug: 06-deployment,    name: Deployment }
  7: { slug: 07-maintenance,   name: Maintenance }
  8: { slug: 08-security,      name: Security }

# What the developer is doing -> which phases are checked.
intents:
  plan:        [1, 2]
  design:      [2, 3]
  commit:      [3, 4, 5, 8]
  push:        [3, 4, 5, 8]
  pr:          [3, 4, 5, 8]
  release:     [3, 4, 5, 6, 7, 8]
  deploy:      [3, 4, 5, 6, 7, 8]
  hotfix:      [4, 5, 6, 7, 8]
  maintenance: [4, 5, 7, 8]

# How the intent is detected when not given explicitly (first match wins, in this order):
#   1. commit-message / PR-body trailer   `SDLC-Intent: deploy`
#   2. branch name patterns
#   3. changed-path heuristics (a code change never drops below the default phases)
#   4. default
intent_detection:
  trailer: SDLC-Intent
  branch_patterns:
    - { pattern: '^(release|releases|deploy|deployment)[/_-]', intent: deploy }
    - { pattern: '^hotfix(es)?[/_-]',                          intent: hotfix }
    - { pattern: '^(plan|planning|rfc|proposal)[/_-]',         intent: plan }
    - { pattern: '^(design|adr|architecture)[/_-]',            intent: design }
    - { pattern: '^(maint|maintenance|chore/deps|dependabot)[/_-]', intent: maintenance }
  path_patterns:
    - intent: deploy
      glob:
        - '**/Dockerfile'
        - '**/Dockerfile.*'
        - '**/docker-compose*.y*ml'
        - '**/*.tf'
        - '**/*.tfvars'
        - '**/helm/**'
        - '**/charts/**'
        - '**/k8s/**'
        - '**/kubernetes/**'
        - '**/manifests/**'
        - '**/.github/workflows/**'
        - '**/azure-pipelines*.yml'
        - '**/Jenkinsfile'
        - '**/serverless.y*ml'
        - '**/cloudformation/**'
    - intent: plan
      glob:
        - 'docs/planning/**'
        - 'docs/rfcs/**'
        - 'docs/proposals/**'
        - '**/*charter*.md'
        - '**/*roadmap*.md'
        - '**/PLAN.md'
    - intent: design
      glob:
        - 'docs/adr/**'
        - 'docs/design/**'
        - 'docs/architecture/**'
        - '**/openapi*.y*ml'
        - '**/openapi*.json'
        - '**/*.proto'
        - '**/*.graphql'
        - '**/migrations/**'
    - intent: maintenance
      glob:
        - '**/CHANGELOG*.md'
        - '**/runbook*.md'
        - '**/SECURITY.md'
        - '**/requirements*.txt'
        - '**/package.json'
        - '**/pom.xml'
        - '**/build.gradle*'
        - '**/go.mod'
        - '**/pyproject.toml'
  default: commit

gate:
  # Findings at or above this severity block the change: blocker | high | medium | low
  fail_on: high
  # If the model cannot be reached the gate FAILS (never silently passes).
  fail_closed: true
  max_diff_bytes: 400000
  max_file_bytes: 120000
  # Additional globs to exclude from review (generated code, fixtures, ...). Lock files and binaries are always excluded.
  exclude_globs:
    - '**/testdata/**'
    - '**/__snapshots__/**'
    - '**/*.generated.*'
  # Completeness and stability of the review.
  review:
    # Minimum passes per phase. Pass 1 reviews the change; every further pass receives what was already found and the
    # taxonomy categories still uncovered, and hunts for what was missed. Results are merged and de-duplicated.
    passes: 2
    # Keep taking another look until a pass finds nothing new, so the first report is complete instead of surfacing
    # new findings on every commit. Each extra pass costs one more model call per phase.
    until_stable: true
    max_passes: 4
    # Findings on code the gate already reviewed in the previous run but did not flag then. `advisory` reports them
    # without blocking (secrets, credentials, vulnerable dependencies and blockers still block); `block` treats them
    # like any other finding.
    late_findings: advisory
    # Remember findings and reviewed code per repository and branch on the developer's machine.
    ledger: true

prechecks:
  enabled: true
  max_file_size_bytes: 5000000
  # Regexes for lines that are known false positives for secret detection (kept deliberately empty; prefer inline
  # `# ai-sdlc-gate: allow-secret` comments so exceptions are visible in review).
  secret_allow_regexes: []

skip:
  enabled: true
  min_reason_chars: 40
  trailer_phases: SDLC-Skip
  trailer_reason: SDLC-Skip-Reason
  # Findings in these categories fail the gate even inside a skipped phase.
  non_skippable_categories:
    - secret-exposure
    - hardcoded-credential
    - known-vulnerable-dependency
    - gate-manipulation
  never_skippable_phases: []
  # Phases whose skip requires an approval label on a pull request. The gate runs on developer machines where no
  # pull request exists yet, so this is empty; deployment/maintenance skips are instead highlighted in the metrics.
  require_approval_for_phases: []
  approval_label: sdlc-skip-approved

# Verified developer identity (Microsoft Entra ID device-code sign-in). See docs/enforcement.md.
identity:
  provider: entra
  authority: https://login.microsoftonline.com
  # Tenant must be your organisation's tenant ID (a GUID). A multi-tenant endpoint such as "organizations" or
  # "common" is rejected at sign-in. Register a dedicated "AI SDLC Gate client" application and put its tenant
  # and client id here; only accounts in allowed_domains are accepted.
  tenant: 8794e153-c3bd-4479-8bea-61aeaf167d5a
  client_id: 04b07795-8ddb-461a-bbee-02f9e1bf7b46
  allowed_domains: [og1o.in]
  # When true, the hooks refuse to commit until the developer has signed in once. Only enforced once tenant and
  # client_id above are set; managed installs always require it once configured.
  required: true

metrics:
  central_repo: arijitaich-og1o/ai-sdlc-gate
  dispatch_event: ai-sdlc-gate-result
  branch: metrics

challenge:
  # A candidate must beat the current skill's weighted score by this margin to replace it outright.
  min_improvement: 0.02
  # Re-evaluate merged skills before accepting them.
  verify_merge: true
  weights: { recall: 0.6, precision: 0.25, clarity: 0.15 }
